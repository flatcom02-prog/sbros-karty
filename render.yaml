# Fallback: Render free Web Service (same origin UI + WSS).
# Stable URL after first create: https://sbros-karty.onrender.com
# Cold starts on free tier; set RENDER_API_KEY or connect GitHub in dashboard.
services:
  - type: web
    name: sbros-karty
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx tsx server/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
